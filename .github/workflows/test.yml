name: 🗳️ CivicNavigator CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm install
      
    - name: Run Security Audit
      run: npm audit --audit-level=high
      
    - name: Run API Tests (Mocha)
      run: |
        # We start the server in the background and wait for it to be ready
        npm start &
        npx wait-on http://localhost:8080/health
        npm test
      env:
        PORT: 8080
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        NODE_ENV: test
